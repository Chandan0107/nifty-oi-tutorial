[DEFAULT]
# All sections below are required unless otherwise specified.
# See https://github.com/AnswerDotAI/nbdev/blob/main/settings.ini for examples.

### Python library ###
repo = nifty-oi-tutorial
lib_name = nifty_oi
version = 0.0.1
min_python = 3.9
license = apache2
black_formatting = False

### nbdev ###
doc_path = _docs
lib_path = nifty_oi
nbs_path = nbs
recursive = True
tst_flags = notest
put_version_in_init = True
update_pyproject = True

### Docs ###
branch = main
custom_sidebar = False
doc_host = https://%(user)s.github.io
doc_baseurl = /%(repo)s
git_url = https://github.com/%(user)s/%(repo)s
title = %(lib_name)s

### PyPI ###
audience = Science/Research
author = Chandan Bhat
author_email = chandanbhat21@gmail.com
copyright = 2025 onwards, %(author)s
description = Tutorial: Bayesian image reconstruction for optical interferometry with NIFTy
keywords = nifty interferometry imaging bayesian oifits
language = English
status = 3
user = Chandan0107

### Optional ###
requirements = numpy matplotlib astropy nifty8 ducc0 finufft
